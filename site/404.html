<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Tyrien Jones</title>
  <!-- Self-contained inline styles (no external file) so this renders correctly
       at any not-found path, with zero dependencies. Matches the v2 site theme. -->
  <style>
    :root {
      --bg: oklch(0.17 0.006 70);
      --text: oklch(0.95 0.008 80);
      --muted: oklch(0.68 0.01 75);
      --accent: oklch(0.70 0.18 48);
      --accent-hi: oklch(0.76 0.17 52);
      --accent-text: oklch(0.78 0.15 52);
    }
    *,*::before,*::after { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--bg); color:var(--text);
      font-family:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height:1.6; padding:0 1.5rem; text-align:center;
      -webkit-font-smoothing:antialiased;
    }
    .code {
      font-family:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      color:var(--accent-text); letter-spacing:0.2em; font-size:0.8rem; margin-bottom:1rem;
      border:1px solid var(--accent); padding:0.45rem 0.8rem;
    }
    h1 {
      font-weight:700; font-stretch:82%;
      font-size:clamp(2.6rem,8vw,4.5rem); line-height:.95; margin:0 0 1rem;
      letter-spacing:-.01em;
    }
    p { color:var(--muted); max-width:46ch; margin:0 0 1.75rem; font-size:1.05rem; }
    a.home {
      font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size:0.85rem; letter-spacing:0.08em; font-weight:600;
      color:var(--bg); background:var(--accent);
      padding:0.85rem 1.4rem; text-decoration:none;
    }
    a.home:hover { background:var(--accent-hi); }
    a.home:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  </style>
</head>
<body>
  <p class="code">ERROR 404</p>
  <h1>Page not found.</h1>
  <p>That page doesn&rsquo;t exist on this site. No harm done &mdash; head back to the front.</p>
  <a class="home" href="/">&larr; BACK TO THE SITE</a>
</body>
</html>
